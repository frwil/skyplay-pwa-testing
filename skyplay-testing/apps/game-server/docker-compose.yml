services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8080"
    volumes:
      # Mount ROMs from the PWA's public/roms directory
      - ../../public/roms:/roms:ro
      # Mount local dist/ for dev (override cached Docker build)
      - ./dist:/app/dist:ro
      # Plan A: where the mp4 recorder writes before Blob upload (inspectable on host)
      - ./recordings:/recordings
    # Plan A: BLOB_READ_WRITE_TOKEN (secret) lives in the gitignored .env, not committed here
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - RETROARCH_CORES_DIR=/usr/lib/libretro
      - ROMS_DIR=/roms
      - FRAME_ENCODE_QUALITY=5
      # Use Xdummy for environments without /dev/fb (CI, some cloud)
      - USE_XDUMMY=0
      # Session token — disabled for local dev (no JWT needed on localhost)
      # - SESSION_TOKEN_SECRET=dev-secret-change-in-production
      # Stats API — points at PROD Next.js so recording metadata + stats reach prod.
      # (Local dev alt: http://host.docker.internal:3000)
      - STATS_API_URL=https://skyplay-testing.vercel.app
      - STATS_API_TOKEN=dev
      # Plan A — recording OFF (a 2nd libx264 encode per duel starves the live feed on
      # this CPU-bound host). Streaming stays gated (inert until a client sends an RTMP key).
      # Re-enable once recording muxes the already-encoded live h264 (tee) instead of re-grabbing.
      - RECORDING_ENABLED=0
      - STREAMING_ENABLED=1
      - RECORDINGS_DIR=/recordings
    # Needed for Xvfb
    stdin_open: true
    tty: true

  # Optional: cores downloader for local dev
  download-cores:
    image: alpine:latest
    volumes:
      - ./cores:/cores
    command: |
      sh -c "
        mkdir -p /cores
        echo 'Downloading fbneo core...'
        wget -q -O /tmp/fbneo.zip https://buildbot.libretro.com/nightly/linux/x86_64/latest/fbneo_libretro.so.zip 2>/dev/null || echo 'fbneo: download failed'
        if [ -f /tmp/fbneo.zip ]; then unzip -o /tmp/fbneo.zip -d /cores/ 2>/dev/null || echo 'fbneo: unzip failed'; fi
        echo 'Downloading pcsx_rearmed core...'
        wget -q -O /tmp/pcsx.zip https://buildbot.libretro.com/nightly/linux/x86_64/latest/pcsx_rearmed_libretro.so.zip 2>/dev/null || echo 'pcsx: download failed'
        if [ -f /tmp/pcsx.zip ]; then unzip -o /tmp/pcsx.zip -d /cores/ 2>/dev/null || echo 'pcsx: unzip failed'; fi
        ls -la /cores/
        echo 'Done.'
      "
    profiles:
      - tools
